<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ayomide's Lesson Note</title>
  <meta name="description" content="Basic 1 First Term lesson notes for 2026, loaded from a dedicated Google Doc.">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="shell header-inner">
      <div>
        <p class="eyebrow">BASIC 1 • FIRST TERM • 2026</p>
        <h1>Ayomide's Lesson Note</h1>
        <p class="subtitle">Week-by-week lesson notes for the complete first term.</p>
      </div>
      <button id="printBtn" class="ghost-btn" type="button" title="Print the current lesson note">Print</button>
    </div>
  </header>

  <main class="shell">
    <section class="control-panel" aria-label="Lesson note filters">
      <div class="control-row">
        <label>
          <span>Week</span>
          <select id="weekSelect"></select>
        </label>
        <label>
          <span>Subject</span>
          <select id="subjectSelect"></select>
        </label>
        <label class="search-field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Search topic or content">
        </label>
        <button id="syncBtn" class="primary-btn" type="button">Reload</button>
      </div>
      <div class="status-row">
        <span id="syncStatus" class="status-pill">Loading built-in lesson notes…</span>
        <a id="sourceLink" class="source-link" href="https://docs.google.com/document/d/1tGks5xH6VpQvfbQG9CSYayHXY_vWygj1YyjMIXVIswI/edit" target="_blank" rel="noopener">Open Google Doc</a>
      </div>
    </section>

    <section id="lessonArea" aria-live="polite"></section>

    <div class="week-nav">
      <button id="prevBtn" class="ghost-btn" type="button">← Previous week</button>
      <button id="nextBtn" class="ghost-btn" type="button">Next week →</button>
    </div>
  </main>

  <template id="lessonTemplate">
    <article class="lesson-card">
      <div class="lesson-head">
        <div>
          <p class="lesson-subject"></p>
          <h2 class="lesson-topic"></h2>
        </div>
        <span class="date-badge"></span>
      </div>
      <div class="lesson-grid">
        <section class="note-section"><h3>Behavioral Objectives</h3><div data-field="objectives"></div></section>
        <section class="note-section"><h3>Instructional Materials</h3><div data-field="materials"></div></section>
        <section class="note-section"><h3>Lesson Content</h3><div data-field="content"></div></section>
        <section class="note-section"><h3>Teacher &amp; Learner Activities</h3><div data-field="activities"></div></section>
        <section class="note-section"><h3>Evaluation</h3><div data-field="evaluation"></div></section>
        <section class="note-section"><h3>Assignment</h3><div data-field="assignment"></div></section>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
