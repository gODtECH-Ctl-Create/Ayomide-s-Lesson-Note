<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayomide's Lesson Note</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="search-page">
  <div class="search-box">
    <p class="eyebrow">BASIC 1 • FIRST TERM • 2026</p>
    <h1>Ayomide's Lesson Note</h1>
    <p class="search-intro">Search for a subject, week, topic, or lesson content.</p>

    <form class="big-search" action="results.html" method="get">
      <input id="searchInput" name="q" type="search" placeholder="What lesson are you looking for?" autocomplete="off">
      <button class="primary-btn" type="submit">Search Lesson</button>
    </form>

    <div class="quick-search">
      <a href="results.html?week=1">Week 1</a>
      <a href="results.html?week=2">Week 2</a>
      <a href="results.html?week=3">Week 3</a>
      <a href="results.html?week=4">Week 4</a>
      <a href="results.html?week=5">Week 5</a>
      <a href="results.html?week=6">Week 6</a>
      <a href="results.html?week=7">Week 7</a>
      <a href="results.html?week=8">Week 8</a>
      <a href="results.html?week=9">Week 9</a>
      <a href="results.html?week=10">Week 10</a>
    </div>

    <p class="status-pill">200 lesson entries • 20 subjects • 10 weeks</p>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
